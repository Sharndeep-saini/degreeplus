name = "degreeplus"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# The built website (created by `npm run build`) is served as static assets.
# /api/* goes to the Worker first; everything else is served straight from dist/.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# Lead database. No id needed: Cloudflare creates this D1 database automatically on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "degreeplus-leads"
